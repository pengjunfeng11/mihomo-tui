[project]
name = "proxy-tui"
version = "0.1.0"
description = "Terminal UI for managing mihomo/Clash proxy on Linux"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "berry" }]
keywords = ["proxy", "mihomo", "clash", "tui", "textual"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Networking",
]
dependencies = [
    "textual>=3.0.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
]

[project.scripts]
proxy-tui = "proxy_tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
